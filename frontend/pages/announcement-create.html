<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create announcement | CivicEvents</title>
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <header id="site-navbar"></header>
    <main class="mx-auto max-w-xl px-4 py-8 sm:py-10">
        <a href="announcements.html" class="text-sm font-semibold text-blue-800 underline">Back to announcements</a>
        <h1 class="mt-4 text-3xl font-bold">Create announcement</h1>
        <form id="announcement-form" class="mt-6 space-y-5 rounded-xl border bg-white p-5 shadow-sm sm:p-8" novalidate>
            <div><label for="title" class="block text-sm font-semibold">Title</label><input id="title" type="text" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></div>
            <div><label for="duration_seconds" class="block text-sm font-semibold">Duration in seconds</label><input id="duration_seconds" type="number" min="0" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></div>
            <div><label for="audio" class="block text-sm font-semibold">Audio file</label><input id="audio" type="file" accept=".mp3,.wav,.m4a,.ogg,audio/*" required class="mt-1 w-full rounded-md border border-slate-300 p-2"><p id="audio-error" class="mt-1 text-sm text-red-700" aria-live="polite"></p></div>
            <label class="flex items-center gap-2 text-sm font-semibold"><input id="published" type="checkbox" checked class="h-4 w-4"> Published</label>
            <div id="upload-progress-wrap" class="hidden"><div class="h-3 overflow-hidden rounded bg-slate-200" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="upload-progress" class="h-full w-0 bg-blue-700"></div></div><p id="upload-progress-text" class="mt-1 text-sm text-slate-600">Uploading: 0%</p></div>
            <p id="announcement-status" class="text-sm" role="alert" aria-live="assertive"></p>
            <button id="announcement-submit" type="submit" class="w-full rounded-md bg-blue-800 px-4 py-3 font-semibold text-white disabled:opacity-60">Create announcement</button>
        </form>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script><script src="../js/auth.js"></script><script src="../js/api.js"></script><script src="../js/layout.js"></script>
    <script>
        $(function () {
            // Role guard: the announcement upload endpoint is admin-only.
            if (!Auth.requireAdmin()) { document.body.setAttribute("hidden", "hidden"); return; }

            $("#audio").on("change", function () {
                var file = this.files && this.files[0];
                $("#audio-error").text("");
                if (!file) return;
                var ext = "." + file.name.split(".").pop().toLowerCase();
                if ([".mp3",".wav",".m4a",".ogg"].indexOf(ext) === -1) {
                    $("#audio-error").text("Choose an MP3, WAV, M4A, or OGG audio file."); this.value = ""; return;
                }
                if (file.size > 5 * 1024 * 1024) { $("#audio-error").text("Audio must be 5 MB or smaller."); this.value = ""; }
            });

            $("#announcement-form").on("submit", function (event) {
                event.preventDefault();
                var title = $.trim($("#title").val());
                var file = $("#audio")[0].files[0];
                if (!title || !file) { $("#announcement-status").text("Title and audio file are required."); return; }
                var formData = new FormData();
                formData.append("title", title);
                formData.append("published", $("#published").is(":checked") ? "true" : "false");
                formData.append("audio", file);
                var duration = $("#duration_seconds").val();
                if (duration !== "") formData.append("duration_seconds", duration);

                var $submit = $("#announcement-submit");
                $submit.prop("disabled", true).text("Uploading...");
                $("#upload-progress-wrap").removeClass("hidden");
                apiRequest({
                    url: BASE_URL + "/api/announcements", method: "POST", processData: false, contentType: false, data: formData,
                    xhr: function () {
                        var xhr = $.ajaxSettings.xhr();
                        if (xhr.upload) xhr.upload.addEventListener("progress", function (progress) {
                            if (!progress.lengthComputable) return;
                            var percent = Math.round(progress.loaded / progress.total * 100);
                            $("#upload-progress").css("width", percent + "%");
                            $("#upload-progress").parent().attr("aria-valuenow", percent);
                            $("#upload-progress-text").text("Uploading: " + percent + "%");
                        });
                        return xhr;
                    },
                    success: function (response) {
                        showToastAfterNavigation(response.message || "Announcement created successfully.", "success");
                        window.location.replace("announcements.html");
                    },
                    error: function (xhr) { $("#announcement-status").text((xhr.responseJSON && xhr.responseJSON.message) || "Unable to create announcement."); },
                    complete: function () { $submit.prop("disabled", false).text("Create announcement"); }
                });
            });
        });
    </script>
</body>
</html>
