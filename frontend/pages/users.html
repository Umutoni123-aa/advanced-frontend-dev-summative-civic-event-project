<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users | CivicEvents</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../css/styles.css"></head>
<body class="bg-slate-50 text-slate-900">
    <header id="site-navbar"></header>
    <main class="mx-auto max-w-6xl px-4 py-8 sm:py-10">
        <a href="dashboard.html" class="text-sm font-semibold text-blue-800 underline">Back to dashboard</a>
        <h1 class="mt-4 text-3xl font-bold">Manage users</h1>
        <p id="users-status" class="mt-2 text-sm text-slate-600" aria-live="polite"></p>
        <div id="users-loading" class="mt-6 space-y-3" aria-label="Loading users"><div class="h-20 animate-pulse rounded-xl bg-slate-200"></div><div class="h-20 animate-pulse rounded-xl bg-slate-200"></div></div>
        <div class="mt-6 overflow-x-auto rounded-xl border bg-white">
            <table class="w-full min-w-[650px] text-left text-sm">
                <caption class="sr-only">CivicEvents users</caption>
                <thead class="border-b bg-slate-100"><tr><th scope="col" class="px-4 py-3">Name</th><th scope="col" class="px-4 py-3">Email</th><th scope="col" class="px-4 py-3">Role</th><th scope="col" class="px-4 py-3">Status</th><th scope="col" class="px-4 py-3">Action</th></tr></thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
        <dialog id="user-dialog" class="w-[calc(100%-2rem)] max-w-md rounded-xl p-0" aria-labelledby="user-dialog-title">
            <div class="p-5"><div class="flex items-center justify-between"><h2 id="user-dialog-title" class="text-xl font-bold">User details</h2><button id="close-user-dialog" type="button" class="rounded px-2 py-1 text-sm font-semibold" aria-label="Close user details">Close</button></div><dl id="user-details" class="mt-4 space-y-3 text-sm"></dl></div>
        </dialog>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js"></script><script src="../js/auth.js"></script><script src="../js/api.js"></script><script src="../js/layout.js"></script>
    <script>
        $(function () {
            // Role guard: user administration is available only to admins.
            if (!Auth.requireAdmin()) { document.body.setAttribute("hidden", "hidden"); return; }
            function escapeHtml(value) { return $("<div>").text(value == null ? "" : value).html(); }
            function loadUsers() {
                apiRequest({
                    url: BASE_URL + "/api/users?page=1&limit=100", method: "GET",
                    success: function (response) {
                        var users = Array.isArray(response.data) ? response.data : [];
                        $("#users-loading").hide();
                        $("#users-status").text(users.length + " users found.");
                        $("#users-table-body").empty();
                        users.forEach(function (user) {
                            var action = user.is_active
                                ? '<button type="button" data-user-action="disable" data-user-id="' + escapeHtml(user.id) + '" class="rounded border border-red-600 px-3 py-2 text-xs font-semibold text-red-700">Disable</button>'
                                : '<button type="button" data-user-action="enable" data-user-id="' + escapeHtml(user.id) + '" class="rounded border border-green-700 px-3 py-2 text-xs font-semibold text-green-800">Enable</button>';
                            $("#users-table-body").append(
                                '<tr class="border-b"><td class="px-4 py-3"><button type="button" data-view-user="' + escapeHtml(user.id) + '" class="font-semibold text-blue-800 underline">' + escapeHtml(user.full_name) + '</button></td>' +
                                '<td class="px-4 py-3">' + escapeHtml(user.email) + '</td><td class="px-4 py-3">' + escapeHtml(user.role) + '</td>' +
                                '<td class="px-4 py-3"><span class="rounded-full px-2 py-1 text-xs ' + (user.is_active ? "bg-green-100 text-green-900" : "bg-red-100 text-red-900") + '">' + (user.is_active ? "Active" : "Disabled") + '</span></td><td class="px-4 py-3">' + action + '</td></tr>'
                            );
                        });
                        if (!users.length) $("#users-table-body").html('<tr><td colspan="5" class="px-4 py-8 text-center text-slate-600">No users found.</td></tr>');
                    },
                    error: function (xhr) { $("#users-loading").hide(); $("#users-status").text((xhr.responseJSON && xhr.responseJSON.message) || "Unable to load users."); }
                });
            }
            $(document).on("click", "[data-view-user]", function () {
                var id = $(this).attr("data-view-user");
                apiRequest({
                    url: BASE_URL + "/api/users/" + encodeURIComponent(id), method: "GET",
                    success: function (response) {
                        var user = response.data || {};
                        $("#user-details").html(
                            '<div><dt class="font-semibold">Full name</dt><dd>' + escapeHtml(user.full_name) + '</dd></div>' +
                            '<div><dt class="font-semibold">Email</dt><dd>' + escapeHtml(user.email) + '</dd></div>' +
                            '<div><dt class="font-semibold">Role</dt><dd>' + escapeHtml(user.role) + '</dd></div>' +
                            '<div><dt class="font-semibold">Status</dt><dd>' + (user.is_active ? "Active" : "Disabled") + '</dd></div>'
                        );
                        document.getElementById("user-dialog").showModal();
                    }
                });
            });
            $("#close-user-dialog").on("click", function () { document.getElementById("user-dialog").close(); });
            $(document).on("click", "[data-user-action]", function () {
                var $button = $(this), action = $button.attr("data-user-action"), id = $button.attr("data-user-id");
                var confirmation = action === "disable" ? "Disable this user?" : "Enable this user?";
                if (!window.confirm(confirmation)) return;
                $button.prop("disabled", true);
                apiRequest({
                    url: BASE_URL + "/api/users/" + encodeURIComponent(id) + "/" + action,
                    method: "PATCH",
                    success: function (response) { showToast(response.message || "User status updated.", "success"); loadUsers(); },
                    error: function (xhr) { showToast((xhr.responseJSON && xhr.responseJSON.message) || "Unable to update user.", "error"); $button.prop("disabled", false); }
                });
            });
            loadUsers();
        });
    </script>
</body>
</html>
